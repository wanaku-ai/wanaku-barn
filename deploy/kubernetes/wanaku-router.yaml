apiVersion: "wanaku.ai/v1alpha1"
kind: WanakuRouter
metadata:
  name: wanaku-ci-dev
  annotations:
    # env.wanaku.ai/QUARKUS_TLS_TRUST_ALL: "false"
spec:
  # Optional: protect Wanaku Server with oauth2-proxy (MCP on port 4180, management on 4181).
  # Requires a Secret with the keys `client-secret` and `cookie-secret`.
  auth:
    enabled: true
    # public OIDC url to interactively log in the browser
    issuerUrl: public-oidc-url
    # internal url non public for non interactive use
    internalIssuerUrl: internal-oidc-url
    clientId: wanaku-mcp-router
    secretName: wanaku-oauth2-proxy
    # env:
    #   - name: OAUTH2_PROXY_LOGIN_URL
    #     value: keycloak.192.168.49.2.nip.io/realms/wanaku/protocol/openid-connect/auth
    #   - name: OAUTH2_PROXY_OIDC_ISSUER_URL
    #     value: keycloak.192.168.49.2.nip.io/realms/wanaku
  exposure:
    enabled: true
    host: replace-wanaku-ingress-host
    # annotations to set in the Ingress resource
    # annotations:
    #   nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  barn:
    enabled: true
    image: wanaku-image-replace
    imagePullPolicy: Always
  # server:
  #   image: quay.io/wanaku/wanaku-server:latest
