apiVersion: v1
kind: Service
metadata:
  labels:
    app: ""
    component: ""
  name: ""
spec:
  ports:
    - name: management
      port: 8080
      protocol: TCP
      targetPort: management
    - name: mcp
      port: 8081
      protocol: TCP
      targetPort: mcp
    - name: inference
      port: 8083
      protocol: TCP
      targetPort: inference
    - name: a2a
      port: 8084
      protocol: TCP
      targetPort: a2a
  selector:
    app: ""
  sessionAffinity: None
  type: ClusterIP
