{{- /*
  Hand-maintained (not generated by quarkus-helm). Renders the CRDs as regular templates, so that
  "helm install" and "helm upgrade" update them. Helm never updates CRDs in the special "crds/" directory.
  The "keep" resource policy stops "helm uninstall" from deleting the CRDs and their custom resources.
*/ -}}
{{- if .Values.crds.install }}
{{- range $path, $_ := .Files.Glob "files/crds/*.yml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $annotations := merge (dict "helm.sh/resource-policy" "keep") (default dict $crd.metadata.annotations) }}
{{- $_ := set $crd.metadata "annotations" $annotations }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
