apiVersion: "wanaku.ai/v1alpha1"
kind: WanakuRouter
metadata:
  name: wanaku-dev
spec:
# Global image pull policy for all deployments
# Valid values: Always, IfNotPresent, Never
# Default: IfNotPresent
#  imagePullPolicy: IfNotPresent
# Exposure configuration for external access (see docs/operate/operator.md#exposure)
# type: Auto (default: Routes on OpenShift, Ingress elsewhere), Route, Ingress or None
# Shared host: management on "/" and MCP on "/mcp" (Ingress requires the host)
#  exposure:
#    host: wanaku.example.com
# One host per listener: OpenShift generates empty hosts; Ingress requires them
#  exposure:
#    listeners:
#      management: {}
#      mcp:
#        host: mcp.wanaku.example.com
#      inference:
#        enabled: true
#      a2a:
#        enabled: true
# Wanaku Server settings (Rust MCP engine) - always deployed
  server: {}
#    image: quay.io/wanaku/wanaku-server:latest
#    imagePullPolicy: IfNotPresent
#    env:
#      - name: WANAKU_INFERENCE_UPSTREAM
#        value: "http://ollama:11434"
# Wanaku Barn settings (optional, for service catalog persistence)
# Set barn.enabled: true to deploy Wanaku Barn alongside Wanaku Server
#  barn:
#    enabled: true
#    image: quay.io/wanaku/wanaku-barn-backend:latest
#    imagePullPolicy: IfNotPresent
#    storage:
#      size: 5Gi
#      storageClassName: ""
#      existingClaim: ""
