apiVersion: "wanaku.ai/v1alpha1"
kind: WanakuRouter
metadata:
  name: wanaku-dev
spec:
# Global image pull policy for all deployments
# Valid values: Always, IfNotPresent, Never
# Default: IfNotPresent
#  imagePullPolicy: IfNotPresent
# Exposure configuration for external access through Ingress (see docs/reference/operator-crds.md#exposure)
# enabled: true (default) creates the Ingress resources; set it to false to keep the router internal
# Shared host: management on "/" and MCP on "/default/mcp" (the host is required)
#  exposure:
#    host: wanaku.example.com
# One host per listener (every exposed listener requires a host)
#  exposure:
#    listeners:
#      management:
#        host: mgmt.wanaku.example.com
#      mcp:
#        host: mcp.wanaku.example.com
#      inference:
#        enabled: true
#        host: inference.wanaku.example.com
#      a2a:
#        enabled: true
#        host: a2a.wanaku.example.com
# Wanaku Server settings (Rust MCP engine) - always deployed
  server: {}
#    image: quay.io/wanaku/wanaku-server:latest
#    imagePullPolicy: IfNotPresent
#    env:
#      - name: WANAKU_INFERENCE_UPSTREAM
#        value: "http://ollama:11434"
# Wanaku Barn settings (optional, for service catalog persistence)
# Set barn.enabled: true to deploy Wanaku Barn alongside Wanaku Server
#  barn:
#    enabled: true
#    image: quay.io/wanaku/wanaku-barn-backend:latest
#    imagePullPolicy: IfNotPresent
#    storage:
#      size: 5Gi
#      storageClassName: ""
#      existingClaim: ""
