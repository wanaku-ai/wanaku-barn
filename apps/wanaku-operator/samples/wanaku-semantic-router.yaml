apiVersion: "wanaku.ai/v1alpha1"
kind: WanakuSemanticRouter
metadata:
  name: support
spec:
  # The WanakuRouter that the runtime registers with
  routerRef: wanaku-dev
  # Set exactly one source. semanticRoute and catalog need spec.barn.enabled on the router.
  source:
    semanticRoute:
      name: support
#    configMapRef:
#      # Contains the route, semantic-router.properties and the files it references
#      name: support-files
#      main: support.camel.yaml
  forward:
    namespace: default
#  wanakuTokenSecretRef:
#    name: wanaku-token
#    key: token
  # Credentials of the expert that the route uses, read from a Secret
  env:
    - name: TYPESAFE_API_KEY
      valueFrom:
        secretKeyRef:
          name: llm-credentials
          key: api-key
#  properties:
#    camel.component.typesafe-ai.model: my-model
