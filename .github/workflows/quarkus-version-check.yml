name: Quarkus Version Check

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - chore/quarkus-version-update

permissions:
  contents: write
  pull-requests: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    if: github.repository == 'wanaku-ai/wanaku-barn'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run version check
        id: check
        run: |
          output=$(./check-quarkus-versions.sh -u 2>&1)
          echo "$output"
          {
            echo 'SCRIPT_OUTPUT<<EOF'
            echo "$output"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet parent/pom.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_OUTPUT: ${{ steps.check.outputs.SCRIPT_OUTPUT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="chore/quarkus-version-update"
          git checkout -b "$branch"
          git add parent/pom.xml

          quarkus_ver=$(grep -oP '<quarkus\.platform\.version>\K[^<]+' parent/pom.xml)

          declare -A old_versions
          while IFS= read -r line; do
            if [[ "$line" =~ ^-[[:space:]]*\<([a-zA-Z0-9._-]+)\>([^<]+)\< ]]; then
              old_versions["${BASH_REMATCH[1]}"]="${BASH_REMATCH[2]}"
            fi
          done < <(git diff --cached parent/pom.xml | grep '^-' | grep -v '^---')

          commit_body=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^\+[[:space:]]*\<([a-zA-Z0-9._-]+)\>([^<]+)\< ]]; then
              prop="${BASH_REMATCH[1]}"
              ver="${BASH_REMATCH[2]}"
              old="${old_versions[$prop]:-?}"
              commit_body+="- ${prop} from ${old} to ${ver}"$'\n'
            fi
          done < <(git diff --cached parent/pom.xml | grep '^+' | grep -v '^+++')

          git commit -m "$(cat <<COMMIT
          chore(deps): update Quarkus extensions to platform ${quarkus_ver}

          ${commit_body}
          COMMIT
          )"
          git push --force-with-lease origin "$branch"

          body=$(cat <<BODY
          Automated Quarkus extension version update generated by \`check-quarkus-versions.sh\`.

          \`\`\`
          ${SCRIPT_OUTPUT}
          \`\`\`

          BODY
          )

          existing_pr=$(gh pr list --head "$branch" --json number --jq '.[0].number')
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --body "$body"
            echo "Updated existing PR #${existing_pr}"
          else
            gh pr create \
              --title "chore(deps): update Quarkus extension versions" \
              --body "$body" \
              --label "dependencies"
          fi

  delete-branch:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "/repos/${{ github.repository }}/git/refs/heads/chore/quarkus-version-update"
