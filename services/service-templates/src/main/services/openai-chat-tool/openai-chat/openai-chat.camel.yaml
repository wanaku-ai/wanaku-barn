- route:
    id: openai-chat-completion
    from:
      uri: ai-tool:openai-chat-completion
      parameters:
        tags: wanaku
        description: "{{tool.description}}"
        parameter.prompt: string
        parameter.prompt.description: "The prompt text to send to OpenAI for chat completion"
        parameter.prompt.required: true
        parameter.systemMessage: string
        parameter.systemMessage.description: "Optional system message to set the behavior of the assistant"
        parameter.model: string
        parameter.model.description: "Override the default OpenAI model (e.g., gpt-4, gpt-3.5-turbo)"
        parameter.temperature: number
        parameter.temperature.description: "Sampling temperature (0.0 to 2.0)"
        parameter.maxTokens: integer
        parameter.maxTokens.description: "Maximum number of tokens to generate"
      steps:
        # The OpenAI component uses these headers when they are set, and the endpoint options otherwise
        - setHeader:
            name: CamelOpenAISystemMessage
            simple: "${header.systemMessage}"
        - setHeader:
            name: CamelOpenAIModel
            simple: "${header.model}"
        - setHeader:
            name: CamelOpenAITemperature
            simple: "${header.temperature}"
        - setHeader:
            name: CamelOpenAIMaxTokens
            simple: "${header.maxTokens}"
        - setBody:
            simple: "${header.prompt}"
        - to:
            uri: "openai:chat-completion"
            parameters:
              apiKey: "{{openai.api.key}}"
              model: "{{openai.model}}"
              temperature: "{{openai.temperature}}"
              maxTokens: "{{openai.max.tokens}}"
              topP: "{{openai.top.p}}"
              systemMessage: "RAW({{openai.system.message}})"
