- route:
    id: langchain4j-agent-chat
    from:
      uri: ai-tool:langchain4j-agent-chat
      parameters:
        tags: wanaku
        description: "{{tool.description}}"
        parameter.message: string
        parameter.message.description: "The user message to send to the AI agent"
        parameter.systemMessage: string
        parameter.systemMessage.description: "Optional system prompt to set the agent's behavior"
      steps:
        # Tool arguments arrive as headers. The agent reads the user message from the body
        # and the system prompt from the CamelLangChain4jAgentSystemMessage header.
        - choice:
            when:
              - simple: "${header.systemMessage} != null && ${header.systemMessage} != ''"
                steps:
                  - setHeader:
                      name: CamelLangChain4jAgentSystemMessage
                      simple: "${header.systemMessage}"
        - setBody:
            simple: "${header.message}"
        - to:
            uri: "langchain4j-agent:{{agent.id}}"
            parameters:
              agent: "#agent"
              tags: users
