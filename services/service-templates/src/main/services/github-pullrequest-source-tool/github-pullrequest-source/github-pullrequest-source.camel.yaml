- route:
    id: github-pullrequest-source
    from:
      uri: ai-tool:github-pullrequest-source
      parameters:
        tags: wanaku
        description: "Fetch pull request information from a GitHub repository"
        parameter.state: string
        parameter.state.description: "Filter PRs by state (open, closed, all). Default: open"
        parameter.head: string
        parameter.head.description: "Filter by head user or head organization and branch (user:branch)"
        parameter.base: string
        parameter.base.description: "Filter by base branch name"
        parameter.sort: string
        parameter.sort.description: "What to sort results by (created, updated, popularity, long-running). Default: created"
        parameter.direction: string
        parameter.direction.description: "The direction of the sort (asc, desc)"
      steps:
      - setHeader:
          name: CamelHttpPath
          simple: "/repos/{{github.owner}}/{{github.repo}}/pulls"
      - setHeader:
          name: CamelHttpMethod
          constant: GET
      - setHeader:
          name: Authorization
          simple: "Bearer {{github.token}}"
      - setHeader:
          name: Accept
          constant: "application/vnd.github+json"
      - setHeader:
          name: User-Agent
          constant: "Wanaku"
      - setHeader:
          name: X-GitHub-Api-Version
          constant: "2022-11-28"
      - setHeader:
          name: CamelHttpQuery
          simple: "state=${header.state}&head=${header.head}&base=${header.base}&sort=${header.sort}&direction=${header.direction}"
      - to:
          uri: "https://api.github.com"
      - convertBodyTo:
          type: "java.lang.String"
