- route:
    id: qdrant-similarity-search
    from:
      uri: ai-tool:qdrant-similarity-search
      parameters:
        tags: wanaku
        description: "{{tool.description}}"
        parameter.query: string
        parameter.query.description: "The text to search for similar content in Qdrant"
        parameter.query.required: true
      steps:
        - setBody:
            simple: "${header.query}"
        - to:
            uri: "openai:embeddings"
            parameters:
              apiKey: "{{embedding.api.key}}"
              baseUrl: "{{embedding.base.url}}"
              embeddingModel: "{{embedding.model}}"
              encodingFormat: float
        - setHeader:
            name: CamelQdrantAction
            constant: "SIMILARITY_SEARCH"
        - setHeader:
            name: CamelQdrantWithPayload
            constant: "true"
        - to:
            uri: "qdrant:{{qdrant.collection}}"
            parameters:
              host: "{{qdrant.host}}"
              port: "{{qdrant.port}}"
              apiKey: "{{qdrant.api.key}}"
              maxResults: "{{qdrant.max.results}}"
        - transformDataType:
            toType: "qdrant:rag"
